name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev xvfb libegl1 libgl1 libgles2 libgl1-mesa-dri
      - name: Build and test (software rendering)
        run: bash linux/tests/run.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test windows/tests/Wallpepper.Tests/Wallpepper.Tests.csproj -c Release
      - name: Publish
        run: dotnet publish windows/Wallpepper.csproj -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: Wallpepper-windows
          path: dist/Wallpepper.exe
